name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
      - release

permissions:
  contents: read

jobs:
  rust-e2e:
    name: Rust E2E Transfer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3056ad9b1fc916cb9a55f7f72ae4a848b7d50249 # 1.91.0
        with:
          toolchain: 1.91.0
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './engine -> target'
      - name: Run engine E2E tests
        run: cargo test --locked --manifest-path engine/Cargo.toml -- --test-threads=1
        timeout-minutes: 10
