name: Lint & Format CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Linting `web-app` codebase
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint script
        run: npm run lint

  audit:
    name: Audit dependency lockfiles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@3056ad9b1fc916cb9a55f7f72ae4a848b7d50249 # 1.91.0
        with:
          toolchain: 1.91.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install dependencies
        run: npm ci
      - name: Run dependency audits
        run: |
          cargo audit --file engine/Cargo.lock
          cargo audit --file src-tauri/Cargo.lock
          npm audit --audit-level=high
